[package]
name = "ai-backend"
version = "0.1.0"
edition = "2024"
default-run = "ai-backend"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tiktoken-rs = { version = "0.12", default-features = false }
jsonwebtoken = "9.3.0"
subtle = "2.6.1"
ring = "0.17"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "json"] }

[profile.dev]
codegen-units = 1

[profile.test]
codegen-units = 1

